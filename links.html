@font-face{font-family:"Roboto Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/L0xTDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vrtSM1J-gEPT5Ese6hmHSh0me8iUI0.woff2) format("woff2"),url(/fonts/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vqPQw.ttf) format("truetype")}
@font-face{font-family:"Inter";font-style:normal;font-weight:900;font-display:swap;src:url(/fonts/Inter.ttf) format("truetype")}
@font-face{font-family:"Varela Round";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/w8gdH283Tvk__Lua32TysjIfp8uPLdshZg.woff2) format("woff2"),url(/fonts/w8gdH283Tvk__Lua32TysjIvoA.ttf) format("truetype")}
*{box-sizing:border-box}
body{background:#fff;color:#101517;cursor:default;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;height:100svh;margin:0;padding:0;text-rendering:optimizeLegibility;word-break:break-word;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
dd,dl,dt,iframe,img,ol,table,ul{border:none;margin:0;padding:0}
img{height:auto;max-width:100%}
a{color:#1d4fc4;cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
a:active{color:#1d4fc4}
a:not(:disabled):focus{border-radius:4px;outline:1.5px solid #1d4fc4;outline-offset:1px}
p{margin:0 0 .9em}
h1,h2,h3,h4,h5,h6{line-height:1em;margin:0}
h2{font-size:24px;font-weight:700}
h3{font-size:20px;font-weight:700;margin:1.2em 0 .2em}
h4{font-size:17px;font-weight:400;margin:0 0 .2em}
h5{font-size:16px;line-height:1em;margin:0 0 .2em}
h6{font-size:14px;line-height:1em;margin:0 0 .2em}
:root{--accent:#1d4fc4;--accent-darker:#1a47b0;--surface:#fff;--bg:#e3eafc;--fg:#101517;--fg-secondary:#50575e;--fg-tint:rgba(16,21,23,.1);--accent-tint:rgba(29,79,196,.15)}
@supports(color:rgb(from white r g b)){.profile,.profile__drawers{--surface:#fff;--bg:#e3eafc;--accent:#1d4fc4;--fg:hsl(from var(--surface) h s clamp(0,calc((l - 50)*-1000),100));--fg-secondary:hsl(from var(--fg) h s l/.75);--fg-tint:hsl(from var(--fg) h s l/.1);--accent-tint:hsl(from var(--accent) h s l/.15)}}
.profile{background-color:var(--bg);margin:0;max-width:unset;min-height:calc(100% - 70px);padding:48px 20px;position:relative;width:100%;z-index:0}
@media(max-width:600px){.profile{padding:16px}}
.g-profile__card{background-color:var(--surface);border-radius:4px;display:flex;flex-direction:column;margin:0 auto 24px;max-width:560px;padding:32px 40px;position:relative}
.g-profile__card:last-of-type{margin-bottom:0}
@media(max-width:600px){.g-profile__card{margin-bottom:16px;padding:24px}}
.g-profile__card-title{font-size:18px;font-weight:700;letter-spacing:-.45px;line-height:150%;margin:0 0 12px}
.g-profile-card__card-item{align-items:flex-start;border-bottom:1px solid var(--fg-tint,#f0f0f0);display:flex;flex-direction:row;gap:8px;padding:16px 0}
.g-profile-card__card-item:first-of-type{padding-top:0}
.g-profile-card__card-item:last-of-type{border-bottom:none;padding-bottom:2px}
.card-item__icon{flex-shrink:0;height:24px;width:24px}
.card-item__icon path{fill:currentColor}
.card-item__info{align-items:flex-start;display:flex;flex:1;flex-direction:column;gap:2px;max-width:100%;min-inline-size:0}
.card-item__info a,.card-item__info span{letter-spacing:-.32px;line-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-item__label{align-items:center;display:flex;gap:4px}
.card-item__label-text{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:24px}
.card-item__link{max-width:100%}
.g-profile__links{font-size:14px}
.g-profile__links a,.g-profile__links span{font-size:inherit;font-weight:700;letter-spacing:-.32px}
.g-profile__links p{color:var(--fg-secondary,#50575e);font-size:inherit;margin-bottom:0}
.g-profile__links .card-item__info p{letter-spacing:-.32px;text-wrap:pretty}
.g-profile__links .g-profile-card__card-item{gap:8px}
.g-profile__links .card-item__icon{color:var(--accent,#1d4fc4)}
.g-profile__links .g-profile-card__card-item--with-image{align-items:center;gap:24px}
.g-profile__links .g-profile-card__card-item--with-image>a{aspect-ratio:16/9;display:block;width:192px}
.g-profile__links .g-profile-card__card-item--with-image img,.g-profile__links .g-profile-card__card-item--with-image .preview{aspect-ratio:16/9;max-width:192px;min-width:192px;object-fit:cover;object-position:top}
@media(max-width:600px){.g-profile__links .g-profile-card__card-item--with-image{align-items:start;border-bottom:none;flex-direction:column;gap:16px;margin-bottom:8px}
.g-profile__links .g-profile-card__card-item--with-image:last-of-type{margin-bottom:0}
.g-profile__links .g-profile-card__card-item--with-image img,.g-profile__links .g-profile-card__card-item--with-image .preview,.g-profile__links .g-profile-card__card-item--with-image>a{height:100%;max-width:100%;width:100%}}
.g-profile-card__card-item-preview{background-color:var(--accent-tint,#f0f0f0);display:block}
img.g-profile-card__card-item-preview{border-radius:4px}
</style>
