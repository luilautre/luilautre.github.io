  <script>
    /*/ === MODE SOMBRE ===
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });*/

    // === ÉVÉNEMENTS ===
    const events = [
      { date: "10-31", title: "Joyeux halloween 🎃!", class: "halloween-bg" },
      { date: "12-25", title: "Joyeux noël 🎄!", class: "noel-bg" },
      //{ date: "mm-dd", title: "Joyeux noël !🎃", class: "nouvelan-bg" },
      { date: "01-01", title: "Bonne année 🎆!", class: "nouvelan-bg" }
    ];

    const now = new Date();

    const today =
      String(now.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(now.getDate()).padStart(2, "0");

    let bgClass = "default-bg";
    let currentEvent = null;

    for (const event of events) {
      if (event.date === today) {
        bgClass = event.class;
        currentEvent = event;
        break;
      }
    }

    document.body.classList.remove("default-bg");
    document.body.classList.add(bgClass);

    // === BONJOUR / BONSOIR + DATE ===
    const heure = now.getHours();
    const greeting = heure < 16 ? "Bonjour" : "Bonsoir";
    const dateStr = now.toLocaleDateString("fr-FR");

    document.getElementById("info-date").textContent =
      `${greeting}, aujourd'hui, nous sommes le ${dateStr}.`;

    // === MESSAGE D'ÉVÉNEMENT ===
    if (currentEvent) {
      document.getElementById("event").innerHTML = "<p>"+currentEvent.title+"</p>";
    }
    // === UTMs ===
    const params = new URLSearchParams(window.location.search);
      ["utm_source","utm_medium","utm_campaign"].forEach(key => {
      const val = params.get(key);
      if (val) localStorage.setItem(key, val);
    });

  </script>
